<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Check real-time arrival times for TMB Metro trains in Barcelona">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
    <meta name="format-detection" content="telephone=no">
    <title>TMB Metro Master</title>
    <script>
      // Opening a station seen before on this device: ask TMB for its times right away instead of
      // waiting for the rest of the page to download. script.js picks up the answer.
      // (Same request and key as ARRIVALS_URL / CREDENTIALS[0] in script.js.)
      (function () {
        try {
          var match = /^#([a-z0-9-]+)(?:&|$)/.exec(location.hash);
          var codes = match && JSON.parse(localStorage.getItem('metromaster.codes') || '{}')[match[1]];
          if (!window.fetch || typeof codes !== 'string' || !/^\d+(,\d+)*$/.test(codes)) return;
          var early = { slug: match[1], codes: codes, sentAt: Date.now() };
          early.request = fetch('https://api.tmb.cat/v1/itransit/metro/estacions?estacions=' + encodeURIComponent(codes) +
              '&temps_teoric=true&app_id=00ebfbd8&app_key=106da0e97d453028e6751b44e675f208', { priority: 'high' })
            .then(function (response) {
              early.receivedAt = Date.now();
              if (!response.ok) throw new Error('TMB API responded with ' + response.status);
              return response.json();
            });
          early.request.catch(function () {});
          window.__metromasterEarly = early;
        } catch (e) {}
      })();
    </script>
    <script>
      // Apply the saved (or system) theme before the first paint to avoid a flash.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('metromaster.theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R65TDP0BHE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-R65TDP0BHE');
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/android-chrome-512x512.png">

    <link rel="preconnect" href="https://api.tmb.cat" crossorigin>
    <link rel="preload" href="estacions_linia.csv" as="fetch" crossorigin>
    <link rel="stylesheet" href="style.css">
    <script src="translations.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="3" transform="rotate(45 12 12)" fill="#e2231a"/>
                    <path d="M7.4 15.4V8.6h2l2.6 3.5 2.6-3.5h2v6.8h-2v-3.7L12 14.9l-2.6-3.2v3.7z" fill="#fff"/>
                </svg>
                <span class="brand-name" data-i18n="title">TMB Metro Master</span>
            </div>
            <div class="topbar-actions">
                <button type="button" class="icon-btn" id="nearby-open" data-i18n-label="nearMe" aria-haspopup="dialog">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4 4 11l7 2 2 7z"/></svg>
                </button>
                <button type="button" class="icon-btn theme-btn" id="theme-toggle">
                    <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></svg>
                    <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
                </button>
            </div>
        </header>

        <button type="button" class="search-trigger" id="search-open" aria-haspopup="dialog">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>
            <span data-i18n="searchPlaceholder">Search for a station</span>
        </button>

        <section class="favorites" id="favorites" hidden>
            <div class="section-head">
                <h2 data-i18n="favorites">Favorites</h2>
                <button type="button" class="text-btn" id="favorites-edit" data-i18n="edit">Edit</button>
            </div>
            <div class="chip-scroller">
                <ul class="chip-row" id="favorite-chips"></ul>
            </div>
        </section>

        <main class="main">
            <section class="station" id="station" hidden>
                <div class="station-head">
                    <h1 class="station-name" id="station-name"></h1>
                    <div class="station-actions">
                        <button type="button" class="icon-btn star-btn" id="favorite-toggle">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>
                        </button>
                        <button type="button" class="icon-btn" id="share-btn" data-i18n-label="share">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5V3.8M8 7.6l4-3.8 4 3.8"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5a2 2 0 0 0-2-2h-1.5"/></svg>
                        </button>
                    </div>
                </div>
                <div class="station-meta">
                    <span class="status" id="status"></span>
                    <button type="button" class="icon-btn icon-btn--small" id="refresh-btn" data-i18n-label="refresh">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.8 4.5v3.9h-3.9"/></svg>
                    </button>
                    <button type="button" class="icon-btn icon-btn--small density-btn" id="density-btn" data-i18n-label="compactView" aria-pressed="false">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M8.5 4.5 12 8l3.5-3.5M8.5 19.5 12 16l3.5 3.5"/></svg>
                    </button>
                </div>
                <div class="line-filters" id="line-filters" role="group" hidden></div>
                <div class="results" id="results" role="region" data-i18n-label="trainArrivalTimes"></div>
            </section>

            <section class="home" id="home" hidden>
                <h1 class="home-title" data-i18n="homeTitle">Find your station</h1>
                <p class="home-text" data-i18n="subtitle">Check the arrival times for the next trains.</p>
                <button type="button" class="pill-btn" id="home-nearby">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4 4 11l7 2 2 7z"/></svg>
                    <span data-i18n="nearMe">Stations near me</span>
                </button>
                <p class="home-hint" id="home-hint" data-i18n="favoritesHint" hidden></p>
                <div id="home-recent"></div>
            </section>

            <p class="page-error" id="page-error" role="alert" hidden></p>
        </main>

        <footer class="footer">
            <nav class="languages" id="languages" data-i18n-label="language">
                <button type="button" data-lang="en" lang="en">English</button>
                <button type="button" data-lang="es" lang="es">Español</button>
                <button type="button" data-lang="ca" lang="ca">Català</button>
                <button type="button" data-lang="zh" lang="zh">中文</button>
            </nav>
            <p class="credit"><span data-i18n="madeBy">Made by</span> <a href="https://www.instagram.com/bodiwho/" target="_blank" rel="noopener noreferrer">@bodiwho</a> <span class="version">v3.3</span></p>
        </footer>
    </div>

    <dialog class="sheet sheet--search" id="search-dialog" data-i18n-label="searchPlaceholder">
        <div class="search-bar">
            <label class="search-field">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>
                <input type="search" id="search-input" data-i18n-placeholder="searchPlaceholder" data-i18n-label="searchPlaceholder"
                       autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
            </label>
            <button type="button" class="text-btn" id="search-cancel" data-i18n="cancel">Cancel</button>
        </div>
        <div class="search-results" id="search-results" tabindex="-1"></div>
    </dialog>

    <dialog class="sheet sheet--bottom" id="favorites-dialog" aria-labelledby="favorites-dialog-title">
        <div class="sheet-head">
            <h2 id="favorites-dialog-title" data-i18n="favorites">Favorites</h2>
            <button type="button" class="text-btn" id="favorites-done" data-i18n="done">Done</button>
        </div>
        <ul class="edit-list" id="favorites-edit-list"></ul>
        <p class="sheet-note" data-i18n="favoritesNote">Favorites are saved on this device and in this page's link.</p>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
