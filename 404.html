<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>TMB Metro Master</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <script>
        // Old path-style links (/station-name or /index.html/station-name) are turned into the
        // hash format the app uses (/#station-name), keeping ?lang= and any favorites.
        (function () {
            var path = location.pathname.replace(/\/index\.html(?=\/|$)/, '');
            var segments = path.split('/').filter(Boolean);
            var slug = segments.length ? segments[segments.length - 1].toLowerCase() : '';
            var hash = location.hash.replace(/^#/, '');
            var hashHasStation = hash.split('&').some(function (part) { return part && part.indexOf('=') === -1; });
            if (slug && !hashHasStation && !/\.[a-z0-9]+$/.test(slug)) {
                hash = hash ? slug + '&' + hash : slug;
            }
            location.replace('/' + location.search + (hash ? '#' + hash : ''));
        })();
    </script>
</head>
<body>
    <p><a href="/">TMB Metro Master</a></p>
</body>
</html>
